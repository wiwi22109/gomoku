<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>五子棋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7ecee; --panel:#f6f8f9; --ink:#1d2a30; --muted:#5b6c73; --line:#c5d0d4; --accent:#b8432f;
  --btn:#1d2a30; --btnink:#f6f8f9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#12181b; --panel:#1b2428; --ink:#e6edf0; --muted:#95a6ad; --line:#2c3a40; --accent:#e0674f; --btn:#e6edf0; --btnink:#12181b; }
}
:root[data-theme="dark"]{ --bg:#12181b; --panel:#1b2428; --ink:#e6edf0; --muted:#95a6ad; --line:#2c3a40; --accent:#e0674f; --btn:#e6edf0; --btnink:#12181b; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:640px;padding:20px 16px 28px}
h1{font-family:"Noto Serif TC","Songti TC",serif;font-size:2rem;margin:0 0 4px;letter-spacing:.12em}
#status{margin:0 0 14px;font-size:1.05rem;min-height:1.6em;color:var(--muted)}
#status.end{color:var(--accent);font-weight:700}
.board-wrap{width:100%}
canvas{display:block;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.28);touch-action:manipulation;cursor:pointer}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.controls label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:4px}
select,button{font:inherit;font-size:.95rem;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
button{background:var(--btn);color:var(--btnink);border-color:var(--btn);cursor:pointer;font-weight:600}
button.alt{background:var(--panel);color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.45;cursor:default}
select:focus-visible,button:focus-visible,canvas:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:10px;margin-left:auto;align-self:flex-end}
p.hint{margin:18px 0 0;font-size:.85rem;color:var(--muted);line-height:1.7}
</style>
</head>
<body>
<main>
  <h1>五子棋</h1>
  <p id="status" role="status" aria-live="polite"></p>
  <div class="board-wrap" id="wrap"><canvas id="cv" tabindex="0" aria-label="五子棋棋盤"></canvas></div>
  <div class="controls">
    <label>難度
      <select id="level"><option value="easy">簡單</option><option value="normal" selected>普通</option><option value="hard">困難</option></select>
    </label>
    <label>我執
      <select id="side"><option value="1">黑棋（先手）</option><option value="2">白棋（後手）</option></select>
    </label>
    <div class="btns">
      <button class="alt" id="undo">悔棋</button>
      <button id="restart">重新開始</button>
    </div>
  </div>
  <p class="hint">黑白雙方輪流下子，橫、直、斜任一方向先連成五子者獲勝。簡單的電腦偶爾會亂下，普通的電腦會進攻也會堵你，困難的電腦還會注意雙重威脅。切換難度會重新開始。</p>
</main>
<script>
(function(){
  var N=15, D=[[0,1],[1,0],[1,1],[1,-1]];
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d'), wrap=document.getElementById('wrap');
  var statusEl=document.getElementById('status'), levelEl=document.getElementById('level'), sideEl=document.getElementById('side');
  var board, hist, turn, over, win, hover=null, thinking=false, size=0, cell=0;

  function inb(r,c){return r>=0&&r<N&&c>=0&&c<N}
  function g(r,c){return board[r*N+c]}

  function findWin(r,c,p){
    for(var i=0;i<4;i++){
      var dr=D[i][0], dc=D[i][1], cells=[[r,c]];
      for(var s=1;s>=-1;s-=2){
        var rr=r+dr*s, cc=c+dc*s;
        while(inb(rr,cc)&&g(rr,cc)===p){cells.push([rr,cc]);rr+=dr*s;cc+=dc*s}
      }
      if(cells.length>=5) return cells;
    }
    return null;
  }

  function sc(n,open){
    if(n>=5) return 1e6;
    if(open===0) return 0;
    var t={4:[0,5000,50000],3:[0,100,2000],2:[0,10,100],1:[0,1,10]};
    return t[n][open];
  }
  function pat(r,c,p,dirs){
    var total=0;
    for(var i=0;i<4;i++){
      var n=1, open=0;
      for(var s=1;s>=-1;s-=2){
        var rr=r+D[i][0]*s, cc=c+D[i][1]*s;
        while(inb(rr,cc)&&g(rr,cc)===p){n++;rr+=D[i][0]*s;cc+=D[i][1]*s}
        if(inb(rr,cc)&&g(rr,cc)===0) open++;
      }
      var v=sc(n,open); total+=v; if(dirs) dirs.push(v);
    }
    return total;
  }

  function aiPick(ai){
    var me=ai, foe=3-ai, best=-1, picks=[], all=[], mid=(N-1)/2, lv=levelEl.value;
    if(hist.length===0) return [7,7];
    for(var r=0;r<N;r++) for(var c=0;c<N;c++){
      if(g(r,c)!==0) continue;
      var near=false;
      for(var a=-2;a<=2&&!near;a++) for(var b=-2;b<=2;b++){
        if(inb(r+a,c+b)&&g(r+a,c+b)!==0){near=true;break}
      }
      if(!near) continue;
      all.push([r,c]);
      var da=[], dd=[], a=pat(r,c,me,da), d=pat(r,c,foe,dd), s, off=(Math.abs(r-mid)+Math.abs(c-mid))*0.1;
      if(lv==='easy') s=a+d*0.6+Math.random()*150;
      else if(lv==='hard'){
        var ta=da.filter(function(x){return x>=2000}).length, td=dd.filter(function(x){return x>=2000}).length;
        s=a*1.2+d*1.1+(ta>=2?3000:0)+(td>=2?2500:0)-off;
      } else s=a*1.05+d-off;
      if(s>best+1e-9){best=s;picks=[[r,c]]} else if(Math.abs(s-best)<=1e-9){picks.push([r,c])}
    }
    if(lv==='easy'&&Math.random()<0.35) return all[Math.floor(Math.random()*all.length)];
    return picks[Math.floor(Math.random()*picks.length)];
  }

  function human(){return +sideEl.value}
  function isAI(){return true}

  function setStatus(){
    var t;
    if(over){
      if(win){
        var w=g(win[0][0],win[0][1]);
        t=isAI()?(w===human()?'你贏了！':'電腦獲勝'):((w===1?'黑棋':'白棋')+'獲勝！');
      } else t='平手，棋盤已滿';
      statusEl.className='end';
    } else {
      statusEl.className='';
      if(isAI()) t=(turn===human())?('輪到你下（'+(turn===1?'黑':'白')+'棋）'):'電腦思考中…';
      else t='輪到'+(turn===1?'黑':'白')+'棋';
    }
    statusEl.textContent=t;
    document.getElementById('undo').disabled=hist.length===0||thinking;
  }

  function place(r,c){
    var p=turn;
    board[r*N+c]=p; hist.push([r,c,p]);
    var w=findWin(r,c,p);
    if(w){win=w;over=true}
    else if(hist.length===N*N){over=true}
    else turn=3-turn;
    setStatus(); draw();
  }

  function maybeAI(){
    if(over||!isAI()||turn===human()) return;
    thinking=true; setStatus();
    setTimeout(function(){
      thinking=false;
      if(over||turn===human()) return;
      var m=aiPick(turn); place(m[0],m[1]);
    },380);
  }

  function newGame(){
    board=new Array(N*N).fill(0); hist=[]; turn=1; over=false; win=null; thinking=false;
    sideEl.disabled=!isAI();
    setStatus(); draw(); maybeAI();
  }

  function undo(){
    if(thinking||hist.length===0) return;
    var steps=1;
    if(isAI()){ steps=(hist[hist.length-1][2]===human())?1:2; if(hist.length<steps) steps=hist.length; }
    while(steps-->0){var m=hist.pop();board[m[0]*N+m[1]]=0;turn=m[2]}
    over=false; win=null; setStatus(); draw();
  }

  function resize(){
    size=Math.min(wrap.clientWidth,600); cell=size/(N+1);
    var dpr=window.devicePixelRatio||1;
    cv.style.width=size+'px'; cv.style.height=size+'px';
    cv.width=Math.round(size*dpr); cv.height=Math.round(size*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  }

  function stone(x,y,p,alpha){
    var rad=cell*0.44, gr=ctx.createRadialGradient(x-rad*.3,y-rad*.3,rad*.1,x,y,rad);
    if(p===1){gr.addColorStop(0,'#555');gr.addColorStop(1,'#050505')}
    else{gr.addColorStop(0,'#ffffff');gr.addColorStop(1,'#c9c9c9')}
    ctx.save(); ctx.globalAlpha=alpha||1;
    ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=cell*.12; ctx.shadowOffsetY=cell*.05;
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function draw(){
    if(!size||!board) return;
    ctx.clearRect(0,0,size,size);
    ctx.fillStyle='#d9b26b'; ctx.fillRect(0,0,size,size);
    ctx.strokeStyle='#5b4423'; ctx.lineWidth=1;
    for(var i=0;i<N;i++){
      var p=cell*(i+1)+.5;
      ctx.beginPath(); ctx.moveTo(cell,p); ctx.lineTo(cell*N,p); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p,cell); ctx.lineTo(p,cell*N); ctx.stroke();
    }
    ctx.fillStyle='#5b4423';
    [[3,3],[3,11],[11,3],[11,11],[7,7]].forEach(function(q){
      ctx.beginPath(); ctx.arc(cell*(q[1]+1)+.5,cell*(q[0]+1)+.5,cell*.1,0,Math.PI*2); ctx.fill();
    });
    if(win){
      var a=win[0], b=win[win.length-1];
      ctx.strokeStyle='#d1432f'; ctx.lineWidth=cell*.12; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(cell*(a[1]+1),cell*(a[0]+1)); ctx.lineTo(cell*(b[1]+1),cell*(b[0]+1)); ctx.stroke();
    }
    for(var r=0;r<N;r++) for(var c=0;c<N;c++){
      var v=g(r,c); if(v) stone(cell*(c+1),cell*(r+1),v);
    }
    if(win){ // redraw stones over the line for clarity
      for(var k=0;k<win.length;k++) stone(cell*(win[k][1]+1),cell*(win[k][0]+1),g(win[k][0],win[k][1]));
    }
    if(hist.length&&!over){
      var l=hist[hist.length-1];
      ctx.fillStyle='#d1432f'; ctx.beginPath(); ctx.arc(cell*(l[1]+1),cell*(l[0]+1),cell*.1,0,Math.PI*2); ctx.fill();
    }
    if(hover&&!over&&!thinking&&g(hover[0],hover[1])===0&&(!isAI()||turn===human())){
      stone(cell*(hover[1]+1),cell*(hover[0]+1),turn,.45);
    }
  }

  function cellAt(e){
    var rect=cv.getBoundingClientRect();
    var x=(e.clientX-rect.left)*(size/rect.width), y=(e.clientY-rect.top)*(size/rect.height);
    var c=Math.round(x/cell-1), r=Math.round(y/cell-1);
    return inb(r,c)?[r,c]:null;
  }

  cv.addEventListener('pointermove',function(e){ if(e.pointerType==='mouse'){hover=cellAt(e);draw()} });
  cv.addEventListener('pointerleave',function(){hover=null;draw()});
  cv.addEventListener('pointerdown',function(e){
    if(over||thinking) return;
    if(isAI()&&turn!==human()) return;
    var m=cellAt(e);
    if(!m||g(m[0],m[1])!==0) return;
    hover=null; place(m[0],m[1]); maybeAI();
  });

  document.getElementById('restart').addEventListener('click',newGame);
  document.getElementById('undo').addEventListener('click',undo);
  levelEl.addEventListener('change',newGame);
  sideEl.addEventListener('change',newGame);
  window.addEventListener('resize',resize);

  resize(); newGame();
})();
</script>
</body>
</html>
